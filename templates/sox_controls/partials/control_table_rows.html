{% for control in controls %}
<tr>
    <td class="col-id">
        <a href="{% url 'sox_controls:control_detail' control.control_id %}" 
           style="text-decoration: none; color: #0066cc;">
            {{ control.control_id }}
        </a>
    </td>
    <td>{{ control.sub_process.business_process.name }}</td>
    <td>{{ control.sub_process.name }}</td>
    <td>{{ control.risk }}</td>
    <td>{{ control.control_description }}</td>
</tr>
{% empty %}
<tr>
    <td colspan="5" style="text-align: center; padding: 20px; color: #666; font-style: italic;">
        No controls match your current filter criteria.
    </td>
</tr>
{% endfor %}
