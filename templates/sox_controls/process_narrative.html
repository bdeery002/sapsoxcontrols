{% extends "base.html" %}

{% block content %}
<div class="process-narrative">
  <p class="disclaimer">
    {{ narrative.disclaimer }}
  </p>

  <h1>{{ narrative.title }}</h1>

  {% if narrative.summary %}
    <p class="lead">{{ narrative.summary }}</p>
  {% endif %}

  <div class="narrative-content">
    {{ content_html|safe }}
  </div>
</div>
{% endblock %}
