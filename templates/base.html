{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SAP Business Process Controls (SOX){% endblock %}</title>
    <meta name="description" content="{% block meta_description %}Brendan Deery's practical SAP-centric SOX control baselines and ITGC frameworks. 16+ years Big 4 & enterprise audit experience. CA/CPA, CISA, CISSP.{% endblock %}">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>

    <script type="application/ld+json">
        {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Brendan Deery",
        "jobTitle": "Senior Manager, IT Internal Audit",
        "knowsAbout": ["SAP", "SOX Controls", "ITGC", "Internal Audit", "IT Security"],
        "url": "https://yoursite.com",
        "sameAs": ["https://www.linkedin.com/in/brendan-deery-b14a8128/"]
        }
    </script>

</head>
<body>
    <div class="container">
        <nav class="sidebar">
            <h2>Navigation</h2>
            <div class="nav-links">
                <a href="{% url 'about:about' %}">About</a>
                <a href="{% url 'sox_controls:index' %}">SAP Business Process Controls (SOX) </a>
                <a href="{% url 'itgc:index' %}">SAP IT General Controls (ITGC)</a>
                {% if user.is_staff %}  <!-- Only show if logged in as staff -->
                <a href="/admin/">Admin Panel</a>
                {% endif %}

                
                {% block nav_extra %}{% endblock %}
            </div>
        </nav>

        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
