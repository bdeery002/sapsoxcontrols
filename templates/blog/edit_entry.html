{% extends "base.html" %}
{% block title %}Edit {{ title }}{% endblock %}

{% block nav_extra %}{% include "blog/_sidebar.html" %}{% endblock %}

{% block body %}
    <h1>Edit Entry: {{ title }}</h1>

    <form action="{% url 'edit_entry' title %}" method="post" class="edit-form">
        {% csrf_token %}
        <div class="form-group form-group--title">
            <label>Title</label>
            <input type="text" name="title" value="{{ title }}">
        </div>

        <div class="form-group form-group--content">
            <label>Markdown Content</label>
            <textarea name="content">{{ content }}</textarea>
        </div>

        <div class="form-actions">
            <input type="submit" value="Save Page" class="btn-save">
        </div>
    </form>
{% endblock %}
