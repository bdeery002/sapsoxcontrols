{% extends "base.html" %}

{% block content %}
<h1>IT General Controls (SOX)</h1>

<!-- Filter Section -->
<div style="background: #fcfcfc; padding: 15px; margin-bottom: 20px; border: 1px solid #000;">
    <form hx-get="{% url 'itgc:index' %}" hx-target="#control-results" hx-push-url="false">
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 10px;">
            <input type="text" name="filter_cat" placeholder="Filter by Category..." 
                value="{{ request.GET.filter_cat }}"
                hx-trigger="keyup changed delay:300ms"
                style="padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem;">
            <input type="text" name="filter_desc" placeholder="Filter by Description..." 
                value="{{ request.GET.filter_desc }}"
                hx-trigger="keyup changed delay:300ms"
                style="padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem;">
            <input type="text" name="filter_risk" placeholder="Filter by Risk..." 
                value="{{ request.GET.filter_risk }}"
                hx-trigger="keyup changed delay:300ms"
                style="padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem;">
        </div>
        <button type="submit" style="padding: 8px 16px; background: #f8f9fa; border: 1px solid #000; border-radius: 4px; cursor: pointer; font-size: 0.9rem;">
            Search
        </button>
    </form>
</div>

<!-- Layer Tabs -->
<div style="display: flex; gap: 5px; margin-bottom: 0;">
    <button hx-get="{% url 'itgc:index' %}" hx-target="#control-results" hx-push-url="false"
            class="tab-btn active"
            style="padding: 10px 20px; border: 1px solid #000; border-bottom: none; background: #fff; cursor: pointer; font-weight: bold;">
        All Layers
    </button>
    {% for layer in layers %}
    <button hx-get="{% url 'itgc:filter_by_layer' layer.slug %}" hx-target="#control-results" hx-push-url="false"
            class="tab-btn"
            style="padding: 10px 20px; border: 1px solid #000; border-bottom: none; background: #e9ecef; cursor: pointer;">
        {{ layer.name }}
    </button>
    {% endfor %}
</div>

<!-- Controls Table -->
<table class="table">
    <thead>
        <tr>
            <th class="col-id">CONTROL ID</th>
            <th class="col-proc">LAYER</th>
            <th class="col-sub">CATEGORY</th>
            <th class="col-risk">RISK</th>
            <th class="col-desc">DESCRIPTION</th>
        </tr>
    </thead>
    <tbody id="control-results">
        {% include "itgc/partials/control_table_rows.html" %}
    </tbody>
</table>

<script>
    function updateActiveTab(el) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
    }
</script>

{% endblock %}
